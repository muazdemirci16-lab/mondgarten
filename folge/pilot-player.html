<title>Kalle & Co. Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;900&display=swap">
<style>
/* Layout: ein Fernseh-Bildschirm (16:9 Bühne) mit Untertitel-Leiste, darunter Fernbedienung und Kapitelliste */
:root{
  --bg:#17141f; --panel:#221e2d; --line:#3a3349; --fg:#f3eefb; --muted:#a79fb8;
  --accent:#ffb02e; --ink:#8b4dff; --sub:rgba(10,8,16,.82);
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;margin:0;line-height:1;color:var(--accent);text-shadow:3px 3px 0 var(--ink)}
h1 small{display:block;font-size:.45em;color:var(--fg);text-shadow:none;letter-spacing:.12em;margin-top:6px}
.hint{color:var(--muted);font-size:13px}

.tv{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 0 0 6px #2c2638,0 0 0 8px #0b0910,0 18px 50px rgba(0,0,0,.55)}
.stage{position:absolute;inset:0;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.bg{position:absolute;inset:0;transition:opacity .6s}
.bg svg{width:100%;height:100%;display:block}
.cast{position:absolute;left:0;right:0;bottom:15%;height:52%;display:flex;justify-content:center;align-items:flex-end;gap:1.5%}
.ch{height:100%;aspect-ratio:120/170;transition:transform .35s,filter .35s,opacity .35s;filter:brightness(.62) saturate(.8);transform:translateY(4%) scale(.9);transform-origin:bottom center}
.ch svg{width:100%;height:100%;overflow:visible}
.ch.talk{filter:none;transform:none;animation:bob .38s ease-in-out infinite alternate}
.ch.big{height:128%}
@keyframes bob{to{transform:translateY(-4%) rotate(-1.5deg)}}
.enter{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0) translateY(40%)}}

.subs{position:absolute;left:3%;right:3%;bottom:3%;background:var(--sub);border-radius:12px;padding:1.4% 2.2%;min-height:18%;
  display:flex;flex-direction:column;justify-content:center;gap:2px;border:2px solid rgba(255,255,255,.08)}
.who{font-family:var(--display);letter-spacing:.06em;font-size:clamp(14px,2.4vw,22px);line-height:1}
.par{color:var(--muted);font-style:italic;font-size:.75em;font-family:var(--body);letter-spacing:0}
.txt{font-size:clamp(13px,2.2vw,21px);font-weight:700;line-height:1.3}
.subs.dir .txt{font-weight:500;font-style:italic;color:#d9d1ea}
.subs.dir .who{color:var(--muted)!important;font-size:clamp(11px,1.6vw,14px)}

.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6%;
  font-family:var(--display);letter-spacing:.05em;color:#fff;background:radial-gradient(circle,#3a1e6e 0,#0d0718 75%);opacity:0;pointer-events:none;transition:opacity .35s}
.card.on{opacity:1}
.card span{font-size:clamp(26px,6vw,64px);line-height:1.05;text-wrap:balance;text-shadow:4px 4px 0 var(--ink)}
.card.freeze{background:rgba(0,0,0,.55)}
.card.freeze span{background:#fff;color:#111;padding:.15em .5em;text-shadow:none;transform:rotate(-3deg);font-size:clamp(24px,5vw,54px)}
.sfx{position:absolute;top:16%;left:50%;transform:translateX(-50%) rotate(-8deg) scale(0);font-family:var(--display);
  font-size:clamp(34px,9vw,96px);color:#ffe14d;-webkit-text-stroke:3px #c2185b;text-shadow:6px 6px 0 #000;pointer-events:none;white-space:nowrap}
.sfx.on{animation:boom 1.4s ease-out forwards}
@keyframes boom{0%{transform:translateX(-50%) rotate(-8deg) scale(0)}15%{transform:translateX(-50%) rotate(-8deg) scale(1.25)}25%,80%{transform:translateX(-50%) rotate(-8deg) scale(1)}100%{transform:translateX(-50%) rotate(-8deg) scale(1);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translate(-2%,1%)}40%{transform:translate(2%,-1%)}60%{transform:translate(-1.5%,-1%)}80%{transform:translate(1%,1%)}}
.zoom{transform:scale(1.35)}
.glitch .ch.boss{animation:gl .15s steps(2) infinite}
@keyframes gl{50%{transform:translateX(3%) skewX(8deg);filter:hue-rotate(90deg)}}
.start{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,#3a1e6e,#0d0718 80%);z-index:5;text-align:center;padding:4%}
.start[hidden]{display:none}
.start .logo{font-family:var(--display);font-size:clamp(40px,10vw,110px);color:var(--accent);text-shadow:5px 5px 0 var(--ink);line-height:.9;letter-spacing:.03em}
.start .ep{font-family:var(--display);letter-spacing:.3em;font-size:clamp(14px,2.6vw,26px)}
.big-play{font-family:var(--display);font-size:clamp(18px,3vw,28px);letter-spacing:.08em;background:var(--accent);color:#1a1020;border:0;border-radius:999px;padding:.45em 1.4em;cursor:pointer;box-shadow:0 5px 0 #b06d00}
.big-play:active{transform:translateY(3px);box-shadow:0 2px 0 #b06d00}

.remote{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.btn{font:inherit;font-weight:900;background:#2f2940;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;min-width:44px}
.btn:hover{background:#3b3350}
.btn:focus-visible,.chap:focus-visible,select:focus-visible,.big-play:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.main{background:var(--accent);color:#1a1020;border-color:transparent;min-width:110px}
.prog{flex:1 1 200px;height:8px;background:#0e0b14;border-radius:99px;overflow:hidden;cursor:pointer;min-width:0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ink),var(--accent));transition:width .3s}
.opt{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
select{font:inherit;background:#2f2940;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.chap{font:inherit;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.chap b{font-family:var(--display);font-weight:400;letter-spacing:.05em;font-size:17px;color:var(--accent)}
.chap span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chap.cur{border-color:var(--accent);background:#2d2540}
h2{font-family:var(--display);font-weight:400;letter-spacing:.06em;font-size:22px;margin:8px 0 0}
.castlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cc .pic{width:70px;height:96px}
.cc b{font-family:var(--display);font-weight:400;letter-spacing:.05em;font-size:17px}
.cc span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.cast{bottom:30%;height:42%}.subs{min-height:26%}}
@media (prefers-reduced-motion:reduce){.ch.talk,.glitch .ch.boss{animation:none}.shake,.sfx.on,.enter{animation:none}.sfx.on{transform:translateX(-50%) rotate(-8deg) scale(1)}.stage{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>KALLE &amp; CO.<small>FOLGE 0 · PILOT</small></h1>
    <div class="hint">Leertaste = Play/Pause · Pfeiltasten = vor/zurück</div>
  </header>

  <div class="tv" id="tv">
    <div class="stage" id="stage">
      <div class="bg" id="bg"></div>
      <div class="cast" id="cast"></div>
      <div class="sfx" id="sfx"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="subs" id="subs"><div class="who" id="who"></div><div class="txt" id="txt"></div></div>
    <div class="card" id="card"><span id="cardtxt"></span></div>
    <div class="start" id="start">
      <div class="logo">KALLE &amp; CO.</div>
      <div class="ep">PILOT</div>
      <button class="big-play" id="bigplay">▶ FOLGE ABSPIELEN</button>
      <div class="hint">Mit „Vorlesen“ sprechen die Figuren mit Computerstimmen.</div>
    </div>

  <div class="remote">
    <button class="btn" id="prev" aria-label="Zurück">⏮</button>

    <span class="count" id="count">0 / 0</span>
    <label class="opt"><input type="checkbox" id="voice"> Vorlesen</label>

      <select id="speed"><option value="0.75">langsam</option><option value="1" selected>normal</option><option value="1.4">schnell</option></select>
    </label>
  </div>

  <h2>KAPITEL</h2>
  <div class="chaps" id="chaps"></div>

  <h2>DIE FIGUREN</h2>
  <div class="castlist" id="castlist"></div>
</div>

<script>
const SCRIPT = [{"t": "scene", "text": "COLD OPEN – „Das Mikrowellen-Problem“"}, {"t": "card", "text": "INNEN. KALLES WURSTPALAST – MORGEN"}, {"t": "dir", "text": "Kalle steht vor einem Toaster. Er hält eine Currywurst in der Hand. Tiefe Konzentration. Epische Musik schwillt an."}, {"t": "line", "who": "KALLE", "par": null, "text": "Heute … schaffe isch's."}, {"t": "dir", "text": "Er steckt die Currywurst in den Toaster. Sie passt nicht. Er drückt. Sie passt nicht. Er nimmt Anlauf und rammt sie mit dem Kopf hinein."}, {"t": "sfx", "text": "SQUISH."}, {"t": "dir", "text": "Pause. Der Toaster raucht. Der Toaster explodiert. Kalle steht verkohlt da, die Koteletten brennen leicht."}, {"t": "line", "who": "KALLE", "par": "gelassen", "text": "… Knusprig."}, {"t": "dir", "text": "Mira kommt mit einem Kaffee herein, sieht das Chaos, dreht um und geht wieder raus."}, {"t": "line", "who": "MIRA (O.S.)", "par": null, "text": "Ich hasse es hier."}, {"t": "card", "text": "CUT – INTRO"}, {"t": "dir", "text": "Kurzer, lauter Titeljingle: Gitarrenriff, das Logo „KALLE & CO.“ fliegt durchs Bild, Gerd fliegt dagegen, das Logo zerbricht. Frosti weint Eiswürfel auf die Trümmer. Klaus winkt fröhlich. Schwarzbild."}, {"t": "scene", "text": "AKT 1 – „Der Brief“"}, {"t": "card", "text": "AUSSEN. KALLES WURSTPALAST – TAG"}, {"t": "dir", "text": "Die Imbissbude: ein umgebautes Dixi-Klo auf Rädern. Ein Schild: „KALLES WURSTPALAST – Jetzt mit 30 % weniger Gesundheitsamt-Beschwerden!“"}, {"t": "dir", "text": "Kalle steht hinter der Theke. Gerd sitzt auf der Kasse und telefoniert über sein Headset."}, {"t": "line", "who": "GERD", "par": null, "text": "Ja … ja … Nein, Brenda, ich sag's dir: Currywurst als Abo-Modell. Wurst-as-a-Service. Das ist die Zukunft. *Gurr.* … Hallo? Brenda?"}, {"t": "dir", "text": "Er wurde weggedrückt."}, {"t": "line", "who": "GERD", "par": "in die Kamera", "text": "Sie ist nicht bereit für Innovation."}, {"t": "dir", "text": "Ein Briefträger fährt auf einem Fahrrad vorbei, wirft einen Brief. Der Brief fliegt in Zeitlupe … und klatscht Kalle mitten ins Gesicht."}, {"t": "sfx", "text": "Dramatischer Vine-Boom-artiger Bass-Schlag."}, {"t": "dir", "text": "Der Briefumschlag ist violett und leuchtet unheimlich. Absender: „DAS AMT – Abteilung für Abteilungen“."}, {"t": "line", "who": "KALLE", "par": null, "text": "Oh, Post! Isch krieg nie Post! Vielleicht isses 'ne Currywurst!"}, {"t": "dir", "text": "Er beißt in den Brief. Kaut. Schluckt."}, {"t": "line", "who": "MIRA", "par": "kommt angerannt", "text": "KALLE! Den muss man LESEN, nicht ESSEN!"}, {"t": "line", "who": "KALLE", "par": "würgt den Brief wieder hoch, er ist vollkommen intakt und trocken", "text": "Ach so."}, {"t": "dir", "text": "Mira nimmt den Brief mit zwei Fingern und liest vor."}, {"t": "line", "who": "MIRA", "par": null, "text": "*„Sehr geehrter Herr Knackwurst. Ihre Imbiss-Genehmigung ist seit 1987 abgelaufen.“*"}, {"t": "line", "who": "KALLE", "par": null, "text": "Isch bin seit 1987 abgelaufen?!"}, {"t": "line", "who": "MIRA", "par": null, "text": "Deine GENEHMIGUNG. *„Sollten Sie bis heute, 23:59 Uhr, keine Verlängerung beantragen, wird Ihr Imbiss … ENTWURSTET.“*"}, {"t": "dir", "text": "Stille. ZOOM auf Kalles Gesicht. ZOOM auf seine Augen. ZOOM in seine Pupille, in der sich eine kleine, weinende Currywurst spiegelt."}, {"t": "line", "who": "KALLE", "par": "flüsternd", "text": "… Ent…wurstet?"}, {"t": "dir", "text": "Hinter ihm springt Frostis Tür auf, das Licht flackert traurig."}, {"t": "line", "who": "FROSTI", "par": null, "text": "*bzzzt* … Ich fühle … KÄLTE."}, {"t": "line", "who": "KALLE", "par": "schreit in den Himmel, die Kamera fährt in die Vogelperspektive hoch, bis man den ganzen Planeten sieht", "text": "NEEEEEEIIIIIIN!"}, {"t": "dir", "text": "Ein Satellit im Orbit wackelt kurz."}, {"t": "card", "text": "CUT."}, {"t": "dir", "text": "Klaus rollt in seinem Topf heran."}, {"t": "line", "who": "KLAUS", "par": null, "text": "Kalle ist traurig. Kalle braucht … Umarmung?"}, {"t": "dir", "text": "Kalle umarmt Klaus. Zwei Sekunden Stille."}, {"t": "line", "who": "KALLE", "par": "Gesicht voller Stacheln, lächelt tapfer", "text": "… Danke, Klaus."}, {"t": "line", "who": "KALLE", "par": "eine Sekunde später, ohrenbetäubend", "text": "AAAAAAAAAAAAAH!"}, {"t": "line", "who": "MIRA", "par": null, "text": "Okay. Leute. Wir gehen zum Amt. Wir füllen EIN Formular aus. Wir sind in zwanzig Minuten wieder hier. Was soll schon schiefgehen?"}, {"t": "dir", "text": "Freeze Frame. Ein Untertitel erscheint:"}, {"t": "card", "text": "ES GING ALLES SCHIEF."}, {"t": "scene", "text": "AKT 2 – „Ziehen Sie eine Nummer“"}, {"t": "card", "text": "INNEN. DAS AMT – EINGANGSHALLE"}, {"t": "dir", "text": "Ein riesiger, endloser Flur aus grauem Linoleum. Neonröhren flackern. In der Ferne tickt eine Uhr extrem laut. Die Wände sind Aktenschränke, die bis in den Himmel reichen. Irgendwo hustet jemand. Fahrstuhlmusik."}, {"t": "dir", "text": "Die Gruppe steht am Eingang. Vor ihnen: ein Nummernautomat."}, {"t": "line", "who": "MIRA", "par": null, "text": "Okay. Nummer ziehen."}, {"t": "dir", "text": "Kalle zieht. Ein Zettel kommt raus. Und noch einer. Und noch einer. Der Zettel ist ENDLOS lang, er rollt durch den ganzen Flur bis zum Horizont."}, {"t": "line", "who": "KALLE", "par": "liest ab", "text": "Nummer … neun Millionen neunhundertneunundneunzigtausend …"}, {"t": "dir", "text": "CUT – ZEITSPRUNG-KARTE: „3 STUNDEN SPÄTER“"}, {"t": "line", "who": "KALLE", "par": null, "text": "… neunhundertneunundneunzig … Komma fünf."}, {"t": "dir", "text": "Über der Tür leuchtet eine Anzeige: „AKTUELLE NUMMER: 4“."}, {"t": "dir", "text": "Alle starren die Anzeige an. Die Anzeige springt auf „3“."}, {"t": "line", "who": "MIRA", "par": null, "text": "Die zählt RÜCKWÄRTS?!"}, {"t": "line", "who": "GERD", "par": null, "text": "Okay, Team, hört zu. Diese Warteschlange ist ein ineffizienter Legacy-Prozess. Ich werde sie … *(setzt die Sonnenbrille ab)* … disruptieren."}, {"t": "dir", "text": "Gerd fliegt nach vorne. Ganz vorn in der Schlange sitzt ein uraltes Skelett mit einer Wartenummer in der knöchernen Hand. Spinnweben."}, {"t": "line", "who": "GERD", "par": null, "text": "Hey, Bro. Sie sehen aus wie jemand, der an einer exklusiven Investment-Opportunity interessiert ist."}, {"t": "dir", "text": "Das Skelett zerfällt zu Staub."}, {"t": "line", "who": "GERD", "par": "sammelt die Wartenummer ein", "text": "… Ich nehme das als Ja."}, {"t": "line", "who": "MIRA", "par": null, "text": "GERD! Das war ein MENSCH!"}, {"t": "line", "who": "GERD", "par": null, "text": "Das war ein *Lead*."}, {"t": "dir", "text": "Plötzlich: ein tiefes, metallisches DING-DONG. Alle Lichter gehen aus. Ein einzelner Scheinwerfer erleuchtet eine Treppe, die vorher nicht da war. Die Fahrstuhlmusik verlangsamt sich, wird tiefer und verzerrter, bis sie zur Kirchenorgel wird."}, {"t": "dir", "text": "Schritte. Jeder Schritt: KLONK. Auf jeder Stufe erscheint ein violetter Abdruck: „ABGELEHNT“."}, {"t": "dir", "text": "Aus dem Dunkel tritt: DER STEMPELMEISTER. Neben ihm hüpft Lochi."}, {"t": "line", "who": "STEMPELMEISTER", "par": "langsam, genießerisch", "text": "Willkommen … im AMT."}, {"t": "line", "who": "LOCHI", "par": null, "text": "*Klack.*"}, {"t": "line", "who": "KALLE", "par": null, "text": "Ey, bisse der Chef hier? Isch brauch nur 'n Stempel für meine Wurstbude, dann bin isch weg."}, {"t": "dir", "text": "Der Stempelmeister ist sofort ganz nah an Kalles Gesicht (ohne sich bewegt zu haben). Das Monokel blitzt."}, {"t": "line", "who": "STEMPELMEISTER", "par": "flüsternd", "text": "Haben Sie … einen … TERMIN?"}, {"t": "line", "who": "KALLE", "par": null, "text": "… Isch hab 'ne Wurst."}, {"t": "dir", "text": "Er hält eine Currywurst hoch. Wo kam die her? Niemand weiß es."}, {"t": "line", "who": "STEMPELMEISTER", "par": "kreischt", "text": "LEBENSMITTEL SIND IN DEN AMTSRÄUMEN NICHT GESTATTET!"}, {"t": "dir", "text": "Er stampft – BOOOM – die Wurst wird mit „ABGELEHNT“ gestempelt und zerfällt zu Asche."}, {"t": "line", "who": "KALLE", "par": "sinkt in Zeitlupe auf die Knie, traurige Geige", "text": "Gerhard … neeein …"}, {"t": "line", "who": "MIRA", "par": null, "text": "Du hast deiner Wurst einen NAMEN gegeben?"}, {"t": "line", "who": "KALLE", "par": null, "text": "Sie hatte einen Namen, bevor isch sie kannte."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Sie wünschen eine Verlängerung Ihrer Genehmigung? *(lacht leise, dann immer lauter, bis die Aktenschränke vibrieren)* Sehr gut. SEHR GUT. Dann müssen Sie … das SPIEL spielen."}, {"t": "dir", "text": "Konfetti-Kanonen explodieren. Die Halle verwandelt sich in ein Gameshow-Studio. Ein Publikum aus gesichtslosen Sachbearbeitern klatscht im Takt. Ein Neonschild: „WER WIRD GENEHMIGT?“"}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Drei Prüfungen. Bestehen Sie alle … erhalten Sie Ihren Stempel. Scheitern Sie … *(Pause)* … werden Sie ARCHIVIERT."}, {"t": "dir", "text": "Er zeigt auf eine Wand. Hunderte Leute stecken in Aktenordnern, nur ihre Köpfe gucken raus. Einer winkt schwach."}, {"t": "line", "who": "ARCHIVIERTER TYP", "par": null, "text": "Ich wollte nur … meinen Wohnsitz ummelden …"}, {"t": "line", "who": "MIRA", "par": "zur Kamera", "text": "Ich hasse es hier."}, {"t": "scene", "text": "AKT 3 – „Die drei Prüfungen“"}, {"t": "scene", "text": "PRÜFUNG 1: „DAS FORMULAR“"}, {"t": "dir", "text": "Ein Pult fährt aus dem Boden. Darauf: ein einzelnes Blatt Papier."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Füllen Sie Formular Q-17 (blau) aus."}, {"t": "line", "who": "MIRA", "par": null, "text": "Okay, das ist machbar. *(liest)* „Formular Q-17 (blau) kann nur in Verbindung mit Formular Q-17 (rot) eingereicht werden.“ Okay, wo ist Q-17 rot?"}, {"t": "dir", "text": "Ein zweites Blatt fällt von der Decke."}, {"t": "line", "who": "MIRA", "par": "liest", "text": "„Formular Q-17 (rot) kann nur eingereicht werden, wenn Formular Q-17 (blau) bereits genehmigt wurde.“"}, {"t": "dir", "text": "Stille."}, {"t": "line", "who": "MIRA", "par": null, "text": "…"}, {"t": "line", "who": "MIRA", "par": null, "text": "… Das ist ein Zirkelschluss."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Das ist ein *Verwaltungsvorgang*."}, {"t": "dir", "text": "Miras Auge zuckt. Ihr Notizblock „Kündigen wollen heute:“ springt von 3 auf 11."}, {"t": "line", "who": "KALLE", "par": null, "text": "Lass misch mal, isch hab da 'ne Idee."}, {"t": "dir", "text": "Kalle nimmt beide Formulare. Faltet sie. Faltet weiter. Faltet. Faltet. Musik: dramatischer Origami-Montage-Song. Er hält das Ergebnis hoch: eine perfekte, wunderschöne Papier-Currywurst."}, {"t": "line", "who": "KALLE", "par": null, "text": "Fertisch."}, {"t": "dir", "text": "Lange Pause. Der Stempelmeister beugt sich vor. Untersucht es mit dem Monokel. Die Musik stoppt."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "… Das ist … *(Stimme zittert)* … das ist … die schönste Ablage, die ich je gesehen habe."}, {"t": "dir", "text": "Eine einzige violette Tinten-Träne läuft unter seinem Monokel hervor."}, {"t": "line", "who": "STEMPELMEISTER", "par": "fängt sich sofort, brüllt", "text": "ANGENOMMEN! NÄCHSTE PRÜFUNG!"}, {"t": "line", "who": "MIRA", "par": null, "text": "WAS?! Das hat GAR KEINEN SINN ergeben!"}, {"t": "line", "who": "GERD", "par": null, "text": "Willkommen im Business, Baby."}, {"t": "scene", "text": "PRÜFUNG 2: „DIE UNTERSCHRIFT“"}, {"t": "dir", "text": "Ein riesiger Bildschirm fährt herunter. Darauf: eine leere Unterschriftenzeile, 30 Meter lang."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Unterschreiben Sie. Mit Ihrem VOLLSTÄNDIGEN, AMTLICHEN Namen. In SCHÖNSCHRIFT. Mit … *(holt etwas hervor)* … DIESEM Stift."}, {"t": "dir", "text": "Er hält einen Füller hoch. Der Füller ist so groß wie ein Baumstamm."}, {"t": "line", "who": "KALLE", "par": null, "text": "Kein Problem!"}, {"t": "dir", "text": "Kalle stemmt den Füller hoch, wankt, rennt im Kreis, zieht eine riesige Spur quer über den Bildschirm, über die Wand, über das Publikum, über Lochi."}, {"t": "line", "who": "LOCHI", "par": "fassungslos", "text": "… *Klack.*"}, {"t": "dir", "text": "Das Ergebnis: eine gigantische Zeichnung einer Currywurst mit Pommes. Daneben, winzig: „kale“."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "DAS. IST. KEIN. NAME."}, {"t": "line", "who": "KALLE", "par": null, "text": "Doch, das is mein Künstlername."}, {"t": "line", "who": "STEMPELMEISTER", "par": "holt aus", "text": "AB-GE-…"}, {"t": "dir", "text": "Plötzlich schiebt sich Frosti dazwischen. Seine Tür öffnet sich. Im Licht steht ein einzelner, abgelaufener Erdbeerjoghurt."}, {"t": "line", "who": "FROSTI", "par": null, "text": "*bzzzt* … Bitte. Er … gibt sich Mühe. *(Pixelaugen werden riesig und feucht)* Haben Sie … jemals … KÄLTE gefühlt?"}, {"t": "dir", "text": "Der Stempelmeister erstarrt. Flashback-Effekt: Sepia-Filter, Spieluhr-Musik. Wir sehen einen kleinen, süßen Baby-Stempel, der alleine in einer leeren Schreibtischschublade sitzt. Niemand benutzt ihn. Er stempelt traurig einen kleinen Abdruck: „bitte hab mich lieb“."}, {"t": "dir", "text": "CUT zurück. Der Stempelmeister räuspert sich."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "… Ich habe … etwas im Auge."}, {"t": "line", "who": "GERD", "par": "flüstert zu Mira", "text": "Er hat ein Monokel. Er hat buchstäblich nur EIN Auge, wo was reinkann."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "ANGENOMMEN! *(schnieft)* Aus … formalen Gründen."}, {"t": "scene", "text": "PRÜFUNG 3: „DIE ZUSTÄNDIGKEIT“"}, {"t": "dir", "text": "Das Studio wird dunkel. Bedrohliche Trommeln. Ein Labyrinth aus Türen erscheint – tausende Türen, alle beschriftet: „Zimmer 1A“, „Zimmer 1A (neu)“, „Zimmer 1A (wirklich neu)“, „NICHT Zimmer 1A“."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Finden Sie … den ZUSTÄNDIGEN SACHBEARBEITER. Sie haben … *(eine riesige Sanduhr kracht auf den Boden)* … bis 23:59 Uhr!"}, {"t": "dir", "text": "Uhr-Einblendung: **23:41"}, {"t": "line", "who": "MIRA", "par": null, "text": "Okay, wir teilen uns auf!"}, {"t": "dir", "text": "SPLIT SCREEN – vier Bildschirme gleichzeitig:"}, {"t": "dir", "text": "— Kalle öffnet eine Tür. Dahinter: eine Tür. Dahinter: eine Tür. Dahinter: eine Currywurst. Er isst sie. Dahinter: eine Tür."}, {"t": "dir", "text": "— Gerd öffnet eine Tür und findet einen Konferenzraum voller Tauben in Anzügen. Sie drehen sich alle gleichzeitig um."}, {"t": "line", "who": "GERD", "par": null, "text": "… Ich bin zuhause."}, {"t": "dir", "text": "Er setzt sich hin. Er kommt nicht wieder."}, {"t": "dir", "text": "— Frosti öffnet eine Tür. Dahinter: eine Kühlschrank-Dating-Show. Eine elegante Gefriertruhe zwinkert ihm zu. Frostis Display zeigt zwei Herzen."}, {"t": "dir", "text": "— Mira öffnet eine Tür. Dahinter: ein Sachbearbeiter."}, {"t": "line", "who": "SACHBEARBEITER", "par": null, "text": "Dafür bin ich nicht zuständig. Gehen Sie zu Zimmer 1A."}, {"t": "dir", "text": "Mira öffnet die nächste Tür. Derselbe Sachbearbeiter."}, {"t": "line", "who": "SACHBEARBEITER", "par": null, "text": "Dafür bin ich nicht zuständig. Gehen Sie zu Zimmer 1A."}, {"t": "dir", "text": "Nächste Tür. Derselbe Sachbearbeiter, jetzt mit Schnurrbart."}, {"t": "line", "who": "SACHBEARBEITER", "par": null, "text": "Ich bin ein anderer Sachbearbeiter. Gehen Sie zu Zimmer 1A."}, {"t": "dir", "text": "Uhr-Einblendung: **23:54"}, {"t": "dir", "text": "Mira sinkt an einer Wand zusammen. Klaus rollt neben sie."}, {"t": "line", "who": "KLAUS", "par": null, "text": "Mira traurig. Mira braucht … Umarmung?"}, {"t": "line", "who": "MIRA", "par": null, "text": "Klaus, das ist echt lieb, aber du bist ein Kaktus."}, {"t": "line", "who": "KLAUS", "par": "Kulleraugen, Blüte senkt sich", "text": "… Ich weiß."}, {"t": "dir", "text": "Mira schaut ihn an. Atmet aus. Und dann … sieht sie etwas. ZOOM auf ein winziges Schild an der Wand, unter tausend Schichten Staub:"}, {"t": "card", "text": "„Hausordnung des AMTES, § 1: Jeder Antrag, der korrekt ausgefüllt ist, MUSS genehmigt werden.“"}, {"t": "dir", "text": "Miras Augen weiten sich. Musik: Ein einzelner, epischer Chorton."}, {"t": "line", "who": "MIRA", "par": null, "text": "… Oh. Oh, ich hab's."}, {"t": "dir", "text": "Sie zieht den Schraubenschlüssel aus ihrer Haare (wie war der da drin?), schraubt einen Aktenschrank auf, holt ein leeres Formular heraus und beginnt in Rekordgeschwindigkeit zu schreiben. Hacker-Musik. Matrix-artige Grüne Buchstaben fliegen über den Bildschirm, obwohl sie mit Kugelschreiber schreibt."}, {"t": "scene", "text": "AKT 4 – „Der Endgegner“"}, {"t": "card", "text": "INNEN. DAS AMT – DER THRONSAAL"}, {"t": "dir", "text": "Ein gewaltiger Saal. Ein Thron aus gestapelten Leitz-Ordnern … nein, aus generischen grauen Ordnern. Der Stempelmeister thront darauf. Die Uhr an der Wand: 23:57."}, {"t": "dir", "text": "Die Tür fliegt auf. Kalle (mit Currywurst-Soße am ganzen Körper), Frosti (mit Lippenstiftabdruck auf der Tür), Klaus und Mira treten ein. Gerd fehlt."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "Sie … haben ZURÜCKGEFUNDEN? Unmöglich! Nicht einmal *ich* finde hier zurück! Ich wohne seit 1974 in diesem Raum!"}, {"t": "line", "who": "MIRA", "par": "hält ein Formular hoch", "text": "Wir haben einen Antrag."}, {"t": "line", "who": "STEMPELMEISTER", "par": "spöttisch", "text": "Ach ja? Was für einen Antrag?"}, {"t": "line", "who": "MIRA", "par": "knallt es auf den Tisch", "text": "Formular 0-0. „Antrag auf Abschaffung des Amtes.“ Vollständig ausgefüllt. In dreifacher Ausführung. Mit Durchschlag. Und gemäß Paragraf 1 Ihrer eigenen Hausordnung … müssen Sie ihn genehmigen."}, {"t": "dir", "text": "Stille. Ein einzelnes Blatt Papier fällt langsam zu Boden. Lochi lässt seinen Mund aufklappen."}, {"t": "line", "who": "LOCHI", "par": null, "text": "… *Klack?!*"}, {"t": "line", "who": "STEMPELMEISTER", "par": "zittert", "text": "N-nein … Das … das ist ein Widerspruch … Wenn ich ihn genehmige, gibt es das Amt nicht mehr … aber wenn ich ihn ablehne, verstoße ich gegen die Hausordnung … und die Hausordnung … IST … DAS … AMT …"}, {"t": "dir", "text": "Sein Körper beginnt zu flackern wie ein kaputtes Videospiel. Glitch-Effekte. Seine Stimme wird verzerrt und pitcht hoch und runter."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "GE-GE-GENEH-ABGE-GENEH-ABGELEH-GENEHHHH—"}, {"t": "line", "who": "KALLE", "par": null, "text": "Mira, was passiert mit dem?"}, {"t": "line", "who": "MIRA", "par": null, "text": "Bürokratie. Sie frisst sich selbst."}, {"t": "dir", "text": "Uhr: **23:58"}, {"t": "line", "who": "STEMPELMEISTER", "par": "brüllt, wächst auf das Fünffache, die Decke kracht weg", "text": "WENN ICH UNTERGEHE … DANN NEHME ICH EUCH MIIIIIT!"}, {"t": "dir", "text": "BOSSKAMPF-MUSIK. Heavy-Metal-Gitarren. Ein Lebensbalken erscheint oben im Bild: „DER STEMPELMEISTER – Oberamtsrat der Finsternis“."}, {"t": "dir", "text": "Der Stempelmeister stampft. Überall regnet es „ABGELEHNT“-Stempel. Frosti weicht aus. Klaus wird getroffen und ist jetzt „ABGELEHNT“ gestempelt."}, {"t": "line", "who": "KLAUS", "par": "liest seinen eigenen Bauch", "text": "… Das tut mehr weh als Stacheln."}, {"t": "line", "who": "MIRA", "par": null, "text": "Kalle! Wir brauchen nur EINEN Stempel auf dem Antrag! Du musst ihn dazu bringen, auf das Papier zu stampfen!"}, {"t": "line", "who": "KALLE", "par": null, "text": "Wie soll isch das machen?!"}, {"t": "dir", "text": "Mira schaut zu Frosti. Frosti schaut zu Mira. Langsam öffnet sich Frostis Tür. Darin: Eine dampfende, perfekte, goldene Currywurst. Engelschor."}, {"t": "line", "who": "FROSTI", "par": null, "text": "*bzzzt* … Ich habe sie … für einen besonderen Tag … aufbewahrt."}, {"t": "line", "who": "KALLE", "par": "Tränen in den Augen", "text": "… Frosti … du warst die ganze Zeit … ein Wurstschrank?"}, {"t": "line", "who": "FROSTI", "par": null, "text": "Ich war immer … mehr … als ein Joghurt."}, {"t": "dir", "text": "Kalle riecht die Wurst. Seine Augen glühen ROT. Bass-Drop. Seine Koteletten fangen an zu schweben. Super-Saiyajin-artige Aura … nein, eine Aura aus Ketchup und Currypulver."}, {"t": "line", "who": "KALLE", "par": "Stimme hallend, drei Oktaven tiefer", "text": "KALLE … ZEIT."}, {"t": "dir", "text": "Zeitlupe. Kalle legt den Antrag auf den Boden, direkt vor den Stempelmeister. Dann legt er die Currywurst MITTEN auf den Antrag."}, {"t": "line", "who": "KALLE", "par": null, "text": "Hey, Stempel! Lebensmittel … in den Amtsräumen!"}, {"t": "dir", "text": "Der Stempelmeister sieht die Wurst. Sein Monokel springt heraus."}, {"t": "line", "who": "STEMPELMEISTER", "par": null, "text": "LEBENSMITTEL SIND IN DEN AMTSRÄUMEN NICHT GESTATTEEEEET!"}, {"t": "dir", "text": "Er springt hoch – höher – durch die zerstörte Decke in den Weltraum – und kracht mit voller Wucht nach unten. Ultra-Zeitlupe. Die Kamera umkreist den Moment wie in einem Actionfilm."}, {"t": "dir", "text": "Uhr: **23:59:59"}, {"t": "sfx", "text": "KA-WUMMMMMMS."}, {"t": "dir", "text": "Weißblende."}, {"t": "dir", "text": "Langsam lichtet sich der Staub. Auf dem Boden liegt der Antrag. Mitten drauf, in perfektem Violett:"}, {"t": "card", "text": "GENEHMIGT."}, {"t": "dir", "text": "Und daneben: ein kleiner Abdruck einer Currywurst."}, {"t": "line", "who": "STEMPELMEISTER", "par": "schwach", "text": "… Nein … neeeiiin …"}, {"t": "dir", "text": "Er löst sich auf. Nicht in Staub – in tausende Blätter Papier, die wie Schnee in Zeitlupe herabschweben. Das gesamte Amt beginnt zu zerfallen. Aktenschränke klappen zusammen. Die archivierten Leute fallen aus ihren Ordnern und jubeln."}, {"t": "line", "who": "ARCHIVIERTER TYP", "par": null, "text": "ICH BIN FREI! ICH KANN MICH UMMELDEN!"}, {"t": "dir", "text": "Dann ist da nur noch: eine weite, leere, sonnige Wiese. Vögel zwitschern."}, {"t": "line", "who": "MIRA", "par": "schaut sich um", "text": "… Wo ist Gerd?"}, {"t": "dir", "text": "CUT: Gerd sitzt mit den Business-Tauben auf der Wiese um einen Tisch, der mitten im Nichts steht."}, {"t": "line", "who": "GERD", "par": null, "text": "Und deshalb … gründen wir: Das Amt 2.0. Bürokratie, aber als App."}, {"t": "dir", "text": "Alle Tauben applaudieren."}, {"t": "line", "who": "MIRA", "par": null, "text": "NEIN. *(zieht ihn am Flügel weg)*"}, {"t": "scene", "text": "AKT 5 – „Die Umarmung“"}, {"t": "dir", "text": "Auf der Wiese liegt, ganz klein, ein winziger Holzstempel. Ohne Anzug. Ohne Monokel. Baby-Größe. Er schaut traurig. Er stempelt leise ins Gras: „bitte hab mich lieb“."}, {"t": "dir", "text": "Alle schauen sich an. Niemand bewegt sich."}, {"t": "dir", "text": "Dann rollt Klaus vor."}, {"t": "line", "who": "KLAUS", "par": null, "text": "… Umarmung?"}, {"t": "dir", "text": "Der kleine Stempel schaut auf. Dann umarmt er Klaus. Fest."}, {"t": "dir", "text": "Stille. Alle halten den Atem an. Wir warten auf den Schrei."}, {"t": "dir", "text": "Kein Schrei. Der Stempel ist aus Holz. Die Stacheln tun ihm nicht weh."}, {"t": "dir", "text": "Klaus' Kulleraugen füllen sich mit Tränen. Sanfte Klaviermusik. Sonnenuntergang."}, {"t": "line", "who": "KLAUS", "par": "flüsternd", "text": "… Meine … erste … Umarmung."}, {"t": "dir", "text": "Frosti öffnet seine Tür, sein Licht leuchtet warm (nicht traurig!). Eiswürfel-Freudentränen."}, {"t": "line", "who": "FROSTI", "par": null, "text": "*bzzzt* … Ich fühle … WÄRME. *(Pause)* … Das ist ein technischer Defekt. Bitte rufen Sie den Kundendienst."}, {"t": "dir", "text": "Kalle wischt sich eine Träne weg und schnäuzt sich lautstark in Gerds Krawatte."}, {"t": "line", "who": "GERD", "par": null, "text": "Bro."}, {"t": "dir", "text": "Der kleine Stempel löst sich von Klaus und stempelt ihm sanft einen Abdruck auf den Topf: Ein kleines Herz."}, {"t": "line", "who": "KALLE", "par": "schluchzt", "text": "Dat is so schön … Isch brauch jetzt 'ne Currywurst."}, {"t": "scene", "text": "SCHLUSS – „Zurück am Imbiss“"}, {"t": "card", "text": "AUSSEN. KALLES WURSTPALAST – NACHT"}, {"t": "dir", "text": "Kalle hängt stolz die neue Genehmigung an die Wand. Daneben hängt jetzt ein Foto von Klaus und dem kleinen Stempel. Der kleine Stempel arbeitet jetzt am Imbiss und stempelt Pommestüten mit „LECKER“."}, {"t": "line", "who": "KALLE", "par": null, "text": "Kalles Wurstpalast … ist wieder im Geschäft!"}, {"t": "dir", "text": "Alle jubeln. Konfetti. Fröhliche Musik."}, {"t": "dir", "text": "Mira lehnt sich zurück und atmet zum ersten Mal in der Folge entspannt aus. Sie streicht auf ihrem Notizblock die Zahl durch und schreibt: „Heute war … okay.“"}, {"t": "line", "who": "MIRA", "par": "lächelt", "text": "Weißt du was? Ich hasse es hier gar nicht so sehr."}, {"t": "dir", "text": "In diesem Moment: Ein Briefträger fährt vorbei. Ein violetter Brief fliegt in Zeitlupe … und klatscht Mira ins Gesicht."}, {"t": "dir", "text": "Sie öffnet ihn langsam. Liest. Ihr Gesicht wird leer."}, {"t": "line", "who": "KALLE", "par": null, "text": "Was steht drin?"}, {"t": "line", "who": "MIRA", "par": "monoton", "text": "„Ihr Antrag auf Abschaffung des Amtes wurde nachträglich abgelehnt. Grund: Falsche Tintenfarbe. Mit freundlichen Grüßen, DAS AMT – Abteilung für Widersprüche gegen Abteilungen.“"}, {"t": "dir", "text": "Stille."}, {"t": "dir", "text": "Ganz langsam dreht sich der kleine Stempel am Imbiss zur Kamera. Sein Auge glitzert für eine halbe Sekunde violett. Orgelton."}, {"t": "line", "who": "LOCHI", "par": "taucht aus der Pommestüte auf", "text": "… *Klack.*"}, {"t": "line", "who": "MIRA", "par": "direkt in die Kamera, extrem langsam", "text": "… Ich. Hasse. Es. Hier."}, {"t": "card", "text": "SCHWARZBILD."}, {"t": "scene", "text": "POST-CREDIT-SZENE"}, {"t": "dir", "text": "Kalle steht wieder vor einem NEUEN Toaster. Er hält eine Currywurst. Epische Musik."}, {"t": "line", "who": "KALLE", "par": null, "text": "Diesmal … schaffe isch's."}, {"t": "dir", "text": "Klaus rollt neben ihn."}, {"t": "line", "who": "KLAUS", "par": null, "text": "Kalle … Umarmung?"}, {"t": "line", "who": "KALLE", "par": null, "text": "Später, Klaus. Isch muss toasten."}, {"t": "dir", "text": "Er rammt die Wurst in den Toaster. Der Toaster explodiert. Die Explosion schleudert Klaus in Kalles Arme."}, {"t": "dir", "text": "Zwei Sekunden Stille."}, {"t": "line", "who": "KALLE", "par": null, "text": "… AAAAAAAAAAAAAAAH!"}, {"t": "line", "who": "KLAUS", "par": "glücklich", "text": "Zweite Umarmung!"}, {"t": "card", "text": "ENDE."}];

function locFor(i){
  let loc='imbiss',night=false,morning=false;
  for(let j=0;j<=i;j++){const o=SCRIPT[j],t=o.text||'';
    if(o.t==='scene'){
      if(/COLD OPEN/.test(t)){loc='imbiss';morning=true;night=false}
      else if(/AKT 1/.test(t)){loc='imbiss';morning=false}
      else if(/AKT 2/.test(t))loc='amt';
      else if(/PRÜFUNG 1|PRÜFUNG 2/.test(t))loc='show';
      else if(/PRÜFUNG 3/.test(t))loc='doors';
      else if(/AKT 4/.test(t))loc='throne';
      else if(/AKT 5/.test(t))loc='wiese';
      else if(/SCHLUSS/.test(t)){loc='imbiss';night=true}
      else if(/POST-CREDIT/.test(t)){loc='imbiss';night=false;morning=true}
    }
    if(o.t==='dir'&&/Gameshow-Studio/.test(t))loc='show';
    if(o.t==='dir'&&/sonnige Wiese/.test(t))loc='wiese';
  }
  return {loc,night,morning};
}
/* Wer ist in der Szene zu sehen: alle Hauptfiguren, die bis jetzt in dieser Szene genannt wurden */
function castFor(i){
  let s=i;while(s>0&&SCRIPT[s].t!=='scene')s--;
  const set=new Set();
  for(let j=s;j<=i;j++){const o=SCRIPT[j];
    if(o.t==='line'){const k=keyOf(o.who);if(k!=='EXTRA')set.add(k);}
    if(o.t==='dir'||o.t==='line')for(const k of MAIN)if(NAMEMAP[k].test(o.text))set.add(k);
  }
  // in Akt 5 / Schluss ist der Stempelmeister als kleiner Stempel dabei, aber nicht als Riese
  return MAIN.filter(k=>set.has(k));
}

const $=id=>document.getElementById(id);
let idx=0,playing=false,timer=null,lastBg='',lastCast='';
const speedSel=$('speed'),voiceBox=$('voice');
const synth=window.speechSynthesis;let deVoice=null;
function pickVoice(){try{const v=synth.getVoices();deVoice=v.find(x=>/^de/i.test(x.lang))||null}catch(e){}}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}

function render(i){
  const o=SCRIPT[i];if(!o)return;
  const {loc,night,morning}=locFor(i);
  const bgKey=loc+night+morning;
  if(bgKey!==lastBg){$('bg').innerHTML=BG[loc](night,morning);lastBg=bgKey}
  const cast=castFor(i);const ck=cast.join();
  const speaker=o.t==='line'?keyOf(o.who):null;
  const showCast=[...cast];if(speaker==='EXTRA')showCast.push('EXTRA');
  const castEl=$('cast');
  if(showCast.join()!==lastCast){
    const prev=new Set(lastCast.split(','));
    castEl.innerHTML=showCast.map(k=>`<div class="ch${CH[k].boss?' boss big':''}${prev.has(k)?'':' enter'}" data-k="${k}">${svgOf(k)}</div>`).join('');
    lastCast=showCast.join();
  }
  castEl.querySelectorAll('.ch').forEach(el=>el.classList.toggle('talk',el.dataset.k===speaker));
  // Untertitel
  const subs=$('subs'),card=$('card');
  card.classList.remove('on','freeze');subs.classList.remove('dir');
  if(o.t==='scene'||o.t==='card'){
    const freeze=/SCHIEF|SCHWARZBILD|ENDE/.test(o.text)&&o.t==='card';
    $('cardtxt').textContent=o.text;card.classList.add('on');if(freeze&&!/SCHIEF/.test(o.text)){}else if(freeze)card.classList.add('freeze');
    if(/INNEN|AUSSEN|CUT|ZEITSPRUNG/.test(o.text)&&o.t==='card'){card.classList.remove('on');subs.classList.add('dir');$('who').textContent='Ort';$('txt').textContent=o.text;}
    else{$('who').textContent='';$('txt').textContent='';}
  }else if(o.t==='line'){
    const c=CH[speaker];$('who').innerHTML=`<span style="color:${c.color}">${o.who}</span>${o.par?` <span class="par">(${o.par})</span>`:''}`;
    $('txt').textContent=o.text;
  }else if(o.t==='sfx'){
    $('who').textContent='';$('txt').textContent='';
  }else{subs.classList.add('dir');$('who').textContent='Regie';$('txt').textContent=o.text;}
  // Effekte
  const stage=$('stage'),t=o.text||'';
  stage.classList.remove('shake','zoom','glitch');void stage.offsetWidth;
  if(o.t==='sfx'){const s=$('sfx');s.textContent=t.replace(/\.$/,'');s.classList.remove('on');void s.offsetWidth;s.classList.add('on');stage.classList.add('shake')}
  if(/explodiert|KA-WUMM|BOOOM|kracht|stampft/.test(t)){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');stage.classList.add('shake')}
  if(o.t==='line'&&(/!{1}/.test(t)&&t===t.toUpperCase()&&t.length>6))stage.classList.add('shake');
  if(/ZOOM/.test(t))stage.classList.add('zoom');
  if(/flackern|Glitch|GENEH-ABGE/.test(t))stage.classList.add('glitch');
  // Fortschritt
  $('bar').style.width=((i+1)/SCRIPT.length*100)+'%';$('count').textContent=`${i+1} / ${SCRIPT.length}`;
  document.querySelectorAll('.chap').forEach(b=>b.classList.toggle('cur',+b.dataset.i<=i&&(+b.dataset.next>i)));
}
function duration(o){const sp=+speedSel.value;const w=(o.text||'').split(/\s+/).length;
  let base=o.t==='scene'?2600:o.t==='card'?2200:o.t==='sfx'?1500:Math.max(1700,w*(o.t==='dir'?300:340)+600);
  return base/sp}
function speak(o,done){
  if(!voiceBox.checked||!synth||!(o.t==='line'||o.t==='dir'||o.t==='scene')){return false}
  try{synth.cancel();
    let text=o.text.replace(/[*„“]/g,'').replace(/…/g,', ');
    if(o.t==='line'&&/^[.…\s]*$/.test(text.replace(/[^\w]/g,'')))return false;
    const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(deVoice)u.voice=deVoice;
    const sp=+speedSel.value;
    if(o.t==='line'){const c=CH[keyOf(o.who)];u.pitch=c.pitch;u.rate=Math.min(2,c.rate*sp)}else{u.pitch=.9;u.rate=1.15*sp;u.volume=.75}
    let fired=false;const fin=()=>{if(!fired){fired=true;done()}};
    u.onend=fin;u.onerror=fin;synth.speak(u);
    setTimeout(()=>{if(!synth.speaking&&!fired)fin()},1500); // falls die Stimme nicht startet
    return true}catch(e){return false}
}
function step(){
  if(!playing)return;
  const o=SCRIPT[idx];render(idx);
  const next=()=>{if(!playing)return;if(idx<SCRIPT.length-1){idx++;timer=setTimeout(step,o.t==='line'?250:350)}else{setPlaying(false)}};
  if(!speak(o,next))timer=setTimeout(next,duration(o));
}
function setPlaying(p){playing=p;clearTimeout(timer);if(!p&&synth)try{synth.cancel()}catch(e){}
  $('play').textContent=p?'⏸ Pause':'▶ Play';if(p){$('start').hidden=true;step()}}
function go(i){idx=Math.max(0,Math.min(SCRIPT.length-1,i));$('start').hidden=true;clearTimeout(timer);if(synth)try{synth.cancel()}catch(e){}
  if(playing)step();else render(idx)}
$('play').onclick=()=>setPlaying(!playing);
$('bigplay').onclick=()=>setPlaying(true);
$('next').onclick=()=>go(idx+1);$('prev').onclick=()=>go(idx-1);
$('prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/r.width*SCRIPT.length))};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing)}else if(e.code==='ArrowRight')go(idx+1);else if(e.code==='ArrowLeft')go(idx-1)});
voiceBox.onchange=()=>{try{localStorage.setItem('kalle-voice',voiceBox.checked?'1':'0')}catch(e){}};
try{voiceBox.checked=localStorage.getItem('kalle-voice')==='1'}catch(e){}

/* Kapitel */
const scenes=SCRIPT.map((o,i)=>o.t==='scene'?i:-1).filter(i=>i>=0);
$('chaps').innerHTML=scenes.map((i,n)=>{const [a,b]=SCRIPT[i].text.split(/\s[–:]\s/);
  return `<button class="chap" data-i="${i}" data-next="${scenes[n+1]??1e9}"><b>${a}</b><span>${(b||'').replace(/[„“]/g,'')}</span></button>`}).join('');
document.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{go(+b.dataset.i);if(!playing)setPlaying(true);$('tv').scrollIntoView({behavior:'smooth',block:'center'})});
/* Figurenliste */
$('castlist').innerHTML=MAIN.map(k=>`<div class="cc"><div class="pic">${svgOf(k)}</div><b style="color:${CH[k].color}">${CH[k].name}</b><span>${CH[k].info}</span></div>`).join('');
render(0);
</script>
